spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customers
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customers/**

            - id: products
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/products/**

            - id: bills
              uri: lb://BILLING-SERVICE
              predicates:
                - Path=/BILLING-SERVICE/**
              filters:
                - StripPrefix=1
